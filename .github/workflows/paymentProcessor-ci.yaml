name: Payment Processor CI
on:
  push: 
    branches: [main, staging]
    paths:
      - "src/PaymentProcessor/**"
      - "src/EventBus/**"
      - "src/EventBusRabbitMQ/**"
      - "src/eShop.ServiceDefaults/**"
      - "src/Shared/ActivityExtensions.cs"
      - ".github/workflows/paymentProcessor-ci.yaml"
      - "Dockerfiles/paymentProcessor.Dockerfile"
  pull_request:
    branches: [main, staging]
    paths:
      - "src/PaymentProcessor/**"
      - "src/EventBus/**"
      - "src/EventBusRabbitMQ/**"
      - "src/eShop.ServiceDefaults/**"
      - "src/Shared/ActivityExtensions.cs"
      - ".github/workflows/paymentProcessor-ci.yaml"
      - "Dockerfiles/paymentProcessor.Dockerfile"
  workflow_dispatch: 

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME}}/eshop-payment-processor
  DOTNET_VERSION: "10.0.x" 
  SERVICE_PROJECT_FILE: src/PaymentProcessor/PaymentProcessor.csproj
  SERVICE_UNIT_TEST_FILE: tests/Application.UnitTests/Application.UnitTests.csproj
  SERVICE_DOCKERFILE: ./Dockerfiles/paymentProcessor.Dockerfile
  SNYK_SARIF: paymentProcessor-snyk.sarif

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Dependencies
        run: |
          dotnet restore ${{env.SERVICE_PROJECT_FILE}}
          dotnet restore ${{env.SERVICE_UNIT_TEST_FILE}}

      - name: Build Solution
        run: |
          dotnet build ${{env.SERVICE_PROJECT_FILE}} --configuration Release --no-restore
          dotnet build ${{env.SERVICE_UNIT_TEST_FILE}} --configuration Release --no-restore   

      - name: Run Unit And Functional Tests
        run: |
          dotnet test ${{env.SERVICE_UNIT_TEST_FILE}} --configuration Release --no-build --verbosity normal 
      
      - name: Publish Application Artifacts
        run: dotnet publish ${{env.SERVICE_PROJECT_FILE}} -c Release -o ./publish
      
      - name: Upload Build Artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: eshop-web-publish
          path: ./publish
      
      - name: Pack and Publish NuGet Packages to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          dotnet pack ${{env.SERVICE_PROJECT_FILE}} -c Release -o ./nuget
          dotnet nuget push ./nuget/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

  security-scan:
    name: Snyk Security Scan
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read 
      security-events: write
      actions: read # required for SARIF upload validation on private/standard repos

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      
      - name: Restore Dependencies
        run: dotnet restore ${{env.SERVICE_PROJECT_FILE}}

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Run Snyk Open Source Scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth ${{secrets.SNYK_TOKEN}}
          snyk test --severity-threshold=high --sarif-file-output=${{env.SNYK_SARIF}}
          
      - name: Upload Snyk Open Source SARIF report
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with: 
          sarif_file: ${{env.SNYK_SARIF}}
          category: open-source-scan
  
  docker-build-scan-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: security-scan
    permissions:
      contents: read
      packages: read 
      security-events: write
      actions: read # required for SARIF upload validation on private/standard repos
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main'
    outputs: 
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest, enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build Docker image locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{env.SERVICE_DOCKERFILE}}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Scan Docker image & generate SARIF
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk auth ${SNYK_TOKEN}
          snyk container test ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} --file=${{env.SERVICE_DOCKERFILE}} --severity-threshold=high --sarif-file-output=${{env.SNYK_SARIF}}

      - name: Upload Snyk report as sarif 
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{env.SNYK_SARIF}}
          category: container-scan

      - name: Push Docker image
        run: |
          docker push --all-tags ${{env.IMAGE_NAME}}
          

